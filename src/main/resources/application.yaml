server:
  port: ${PORT:8080}

spring:
  application:
    name: releasepilot

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/releasepilot}
    username: ${SPRING_DATASOURCE_USERNAME:releasepilot}
    password: ${SPRING_DATASOURCE_PASSWORD:releasepilot}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata

  jackson:
    time-zone: Asia/Kolkata

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

releasepilot:
  cache:
    enabled: ${REDIS_ENABLED:false}
    ttl-seconds: ${REDIS_CACHE_TTL:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method